[build-system]
requires = ["setuptools==84.1.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"
[project]
name = "jv-qee-synthetic"
version = "1.0.0"
description = "Independent didactic synthetic three-phase power quality model"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "docs/FONT_LICENSE_DEJAVU.txt"]
dependencies = ["numpy==2.3.5", "pandas==2.3.3", "matplotlib==3.10.7", "openpyxl==3.1.5", "defusedxml==0.7.1"]
[project.scripts]
jv-qee = "jv_qee.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[project.optional-dependencies]
dev = ["pytest==9.0.3", "pytest-cov==7.1.0", "ruff==0.17.4", "bandit==1.9.4", "pip-audit==2.10.1", "PyYAML==6.0.3"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["legacy", "build"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B905"]

[tool.coverage.run]
source = ["jv_qee"]
branch = true
parallel = true
patch = ["subprocess"]
[tool.coverage.report]
show_missing = true
